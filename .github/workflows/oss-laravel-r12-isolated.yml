name: OSS Laravel candidate baseline
on:
  push:
    branches:
      - automation/laravel-validation-r12
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: bb492c5ef5b79c5e466a2fdbaff04f29e3a53d72
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit tests/Support/SupportLazyCollectionConcatKeysTest.php
