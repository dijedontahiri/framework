name: OSS Laravel differential probe

on:
  push:
    branches:
      - automation/laravel-differential-probe

permissions:
  contents: read

jobs:
  collection-parity:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1d9727160ad440d1ccf2fdcbb7e4f4f36efae212
    steps:
      - name: Checkout exact upstream-equivalent source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Differentially probe Collection and LazyCollection
        shell: bash
        run: |
          cat > /tmp/collection-parity.php <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';

          use Illuminate\Support\Collection;
          use Illuminate\Support\Enumerable;
          use Illuminate\Support\LazyCollection;

          function normalize(mixed $value): mixed {
              if ($value instanceof Enumerable) {
                  $value = $value->all();
              }
              if (is_array($value)) {
                  foreach ($value as $key => $item) {
                      $value[$key] = normalize($item);
                  }
              }
              return $value;
          }

          function capture(callable $callback): array {
              set_error_handler(static function (int $severity, string $message, string $file, int $line): never {
                  throw new ErrorException($message, 0, $severity, $file, $line);
              });
              try {
                  return ['ok' => true, 'value' => normalize($callback())];
              } catch (Throwable $e) {
                  return ['ok' => false, 'exception' => $e::class, 'message' => $e->getMessage()];
              } finally {
                  restore_error_handler();
              }
          }

          $datasets = [
              'seq3' => ['a', 'b', 'c'],
              'seq5' => [1, 2, 3, 4, 5],
              'sparse' => [2 => 'a', 5 => 'b', 9 => 'c'],
              'dupes' => [1, '1', 2, 2, null, false, 0, '0'],
              'nested' => [['a' => 1], [], ['b' => [2, 3]]],
              'assoc' => ['a' => 1, 'b' => 2, 'c' => 3],
              'empty' => [],
          ];

          $cases = [];
          foreach ([-10, -5, -4, -3, -1, 0, 1, 2, 3, 5, 10] as $limit) {
              $cases[] = ["take($limit)", fn ($c) => $c->take($limit)];
          }
          foreach ([-10, -5, -1, 0, 1, 2, 5, 10] as $offset) {
              foreach ([null, 0, 1, 2, 10] as $length) {
                  $label = 'slice('.$offset.','.var_export($length, true).')';
                  $cases[] = [$label, fn ($c) => $c->slice($offset, $length)];
              }
          }
          foreach ([0, 1, 2, 3, 5, 10] as $skip) {
              $cases[] = ["skip($skip)", fn ($c) => $c->skip($skip)];
          }
          foreach ([1, 2, 3, 5] as $step) {
              foreach ([0, 1, 2, 5] as $offset) {
                  $cases[] = ["nth($step,$offset)", fn ($c) => $c->nth($step, $offset)];
              }
          }
          foreach ([-10, -5, -3, -1, 0, 1, 3, 5, 10] as $size) {
              $cases[] = ["pad($size)", fn ($c) => $c->pad($size, 'x')];
          }
          foreach ([1, 2, 3, 5, 10] as $size) {
              $cases[] = ["chunk($size)", fn ($c) => $c->chunk($size)];
              $cases[] = ["sliding($size)", fn ($c) => $c->sliding($size)];
          }
          foreach ([1, 2, 3, 5, 10] as $groups) {
              $cases[] = ["split($groups)", fn ($c) => $c->split($groups)];
              $cases[] = ["splitIn($groups)", fn ($c) => $c->splitIn($groups)];
          }
          foreach ([1, 2, INF] as $depth) {
              $cases[] = ['flatten('.(is_infinite($depth) ? 'INF' : $depth).')', fn ($c) => $c->flatten($depth)];
          }
          $cases = array_merge($cases, [
              ['reverse', fn ($c) => $c->reverse()],
              ['values', fn ($c) => $c->values()],
              ['keys', fn ($c) => $c->keys()],
              ['flip', fn ($c) => $c->flip()],
              ['unique', fn ($c) => $c->unique()],
              ['uniqueStrict', fn ($c) => $c->uniqueStrict()],
              ['collapse', fn ($c) => $c->collapse()],
              ['zip-short', fn ($c) => $c->zip(['x'])],
              ['zip-long', fn ($c) => $c->zip(['x', 'y', 'z', 'w', 'v', 'u'])],
              ['combine-short', fn ($c) => $c->combine(['x'])],
              ['combine-long', fn ($c) => $c->combine(['x', 'y', 'z', 'w', 'v', 'u'])],
              ['replace', fn ($c) => $c->replace(['a' => 'x', 0 => 'z'])],
              ['merge', fn ($c) => $c->merge(['x', 'y'])],
              ['except', fn ($c) => $c->except(['a', 0])],
              ['only', fn ($c) => $c->only(['a', 0])],
          ]);

          $mismatches = [];
          foreach ($datasets as $datasetName => $items) {
              foreach ($cases as [$caseName, $operation]) {
                  $eager = capture(fn () => $operation(new Collection($items)));
                  $lazy = capture(fn () => $operation(new LazyCollection($items)));
                  if ($eager !== $lazy) {
                      $mismatches[] = compact('datasetName', 'caseName', 'eager', 'lazy');
                  }
              }
          }

          echo "SOURCE_SHA=".trim(shell_exec('git rev-parse HEAD')).PHP_EOL;
          echo "PHP_VERSION=".PHP_VERSION.PHP_EOL;
          echo "MISMATCH_COUNT=".count($mismatches).PHP_EOL;
          foreach ($mismatches as $mismatch) {
              echo json_encode($mismatch, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          PHP
          php /tmp/collection-parity.php
