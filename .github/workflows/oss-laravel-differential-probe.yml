name: OSS Laravel differential probe

on:
  push:
    branches:
      - automation/laravel-differential-probe

permissions:
  contents: read

jobs:
  collection-parity:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_SHA: 1d9727160ad440d1ccf2fdcbb7e4f4f36efae212
    steps:
      - name: Checkout exact upstream-equivalent source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Verify source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Differentially probe Collection and LazyCollection
        shell: bash
        run: |
          cat > /tmp/collection-parity.php <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';

          use Illuminate\Support\Collection;
          use Illuminate\Support\Enumerable;
          use Illuminate\Support\LazyCollection;

          function normalize(mixed $value): mixed {
              if ($value instanceof Enumerable) {
                  $value = $value->all();
              }
              if (is_array($value)) {
                  foreach ($value as $key => $item) {
                      $value[$key] = normalize($item);
                  }
              }
              if (is_object($value)) {
                  return ['__class' => $value::class, '__vars' => get_object_vars($value)];
              }
              return $value;
          }

          function capture(callable $callback): array {
              set_error_handler(static function (int $severity, string $message, string $file, int $line): never {
                  throw new ErrorException($message, 0, $severity, $file, $line);
              });
              try {
                  return ['ok' => true, 'value' => normalize($callback())];
              } catch (Throwable $e) {
                  return ['ok' => false, 'exception' => $e::class, 'message' => $e->getMessage()];
              } finally {
                  restore_error_handler();
              }
          }

          $scalarSets = [
              'seq' => [1, 2, 3, 4, 5],
              'assoc' => ['a' => 1, 'b' => 2, 'c' => 3],
              'sparse' => [2 => 1, 5 => 2, 9 => 3],
              'mixed' => [1, '1', 2, 2, null, false, 0, '0', '', true],
              'empty' => [],
          ];

          $rowSets = [
              'rows' => [
                  7 => ['id' => 1, 'group' => 'a', 'score' => 10, 'flag' => true, 'nullable' => null],
                  9 => ['id' => 2, 'group' => 'b', 'score' => 20, 'flag' => false, 'nullable' => 'x'],
                  12 => ['id' => 3, 'group' => 'a', 'score' => 15, 'flag' => true, 'nullable' => null],
                  20 => ['id' => 4, 'group' => 'b', 'score' => 20, 'flag' => false, 'nullable' => 'y'],
              ],
              'rows-empty' => [],
          ];

          $scalarCases = [
              ['map', fn ($c) => $c->map(fn ($v, $k) => (string) $k.':'.json_encode($v))],
              ['filter-even', fn ($c) => $c->filter(fn ($v) => is_int($v) && $v % 2 === 0)],
              ['reject-null', fn ($c) => $c->reject(fn ($v) => $v === null)],
              ['partition-int', fn ($c) => $c->partition(fn ($v) => is_int($v))],
              ['duplicates', fn ($c) => $c->duplicates()],
              ['duplicatesStrict', fn ($c) => $c->duplicatesStrict()],
              ['diff', fn ($c) => $c->diff([1, 3, '0'])],
              ['diffStrict', fn ($c) => $c->diffAssocUsing([1, 3], fn ($a, $b) => $a <=> $b)],
              ['intersect', fn ($c) => $c->intersect([0, 1, 3])],
              ['intersectByKeys', fn ($c) => $c->intersectByKeys([0 => null, 'b' => null, 9 => null])],
              ['sort', fn ($c) => $c->sort()],
              ['sortDesc', fn ($c) => $c->sortDesc()],
              ['sortKeys', fn ($c) => $c->sortKeys()],
              ['sortKeysDesc', fn ($c) => $c->sortKeysDesc()],
              ['skipUntil-value', fn ($c) => $c->skipUntil(2)],
              ['skipWhile', fn ($c) => $c->skipWhile(fn ($v) => $v !== 2)],
              ['takeUntil-value', fn ($c) => $c->takeUntil(3)],
              ['takeWhile', fn ($c) => $c->takeWhile(fn ($v) => $v !== 3)],
              ['mapWithKeys', fn ($c) => $c->mapWithKeys(fn ($v, $k) => ['k'.(string) $k => $v])],
              ['flatMap', fn ($c) => $c->flatMap(fn ($v) => [$v, $v])],
              ['prepend-no-key', fn ($c) => $c->prepend('p')],
              ['prepend-key', fn ($c) => $c->prepend('p', 'z')],
              ['concat', fn ($c) => $c->concat(['x' => 'x', 99 => 'y'])],
          ];

          $rowCases = [
              ['where-group-a', fn ($c) => $c->where('group', 'a')],
              ['whereStrict-id-string', fn ($c) => $c->whereStrict('id', '2')],
              ['whereIn', fn ($c) => $c->whereIn('id', [2, 4])],
              ['whereInStrict', fn ($c) => $c->whereInStrict('id', ['2', 4])],
              ['whereNotIn', fn ($c) => $c->whereNotIn('id', [2, 4])],
              ['whereBetween', fn ($c) => $c->whereBetween('score', [15, 20])],
              ['whereNotBetween', fn ($c) => $c->whereNotBetween('score', [15, 20])],
              ['whereNull', fn ($c) => $c->whereNull('nullable')],
              ['whereNotNull', fn ($c) => $c->whereNotNull('nullable')],
              ['pluck-values', fn ($c) => $c->pluck('score')],
              ['pluck-keyed', fn ($c) => $c->pluck('score', 'id')],
              ['keyBy', fn ($c) => $c->keyBy('id')],
              ['groupBy', fn ($c) => $c->groupBy('group')],
              ['mapToGroups', fn ($c) => $c->mapToGroups(fn ($row) => [$row['group'] => $row['id']])],
              ['sortBy', fn ($c) => $c->sortBy('score')],
              ['sortByDesc', fn ($c) => $c->sortByDesc('score')],
              ['unique-score', fn ($c) => $c->unique('score')],
              ['uniqueStrict-score', fn ($c) => $c->uniqueStrict('score')],
          ];

          $mismatches = [];
          foreach ($scalarSets as $datasetName => $items) {
              foreach ($scalarCases as [$caseName, $operation]) {
                  $eager = capture(fn () => $operation(new Collection($items)));
                  $lazy = capture(fn () => $operation(new LazyCollection($items)));
                  if ($eager !== $lazy) {
                      $mismatches[] = compact('datasetName', 'caseName', 'eager', 'lazy');
                  }
              }
          }
          foreach ($rowSets as $datasetName => $items) {
              foreach ($rowCases as [$caseName, $operation]) {
                  $eager = capture(fn () => $operation(new Collection($items)));
                  $lazy = capture(fn () => $operation(new LazyCollection($items)));
                  if ($eager !== $lazy) {
                      $mismatches[] = compact('datasetName', 'caseName', 'eager', 'lazy');
                  }
              }
          }

          echo "SOURCE_SHA=".trim(shell_exec('git rev-parse HEAD')).PHP_EOL;
          echo "PHP_VERSION=".PHP_VERSION.PHP_EOL;
          echo "MISMATCH_COUNT=".count($mismatches).PHP_EOL;
          foreach ($mismatches as $mismatch) {
              echo json_encode($mismatch, JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE).PHP_EOL;
          }
          PHP
          php /tmp/collection-parity.php
