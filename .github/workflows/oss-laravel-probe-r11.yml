name: OSS Laravel semantic parity probe R12
on:
  push:
    branches: [automation/laravel-probe-r11]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5841965e11a09fc9777836793d94423b9039739f
          fetch-depth: 1
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Probe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5841965e11a09fc9777836793d94423b9039739f"
          cat > /tmp/probe.php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          use Illuminate\Support\Collection;
          use Illuminate\Support\Enumerable;
          use Illuminate\Support\LazyCollection;
          function norm($v){if($v instanceof Enumerable)return ['c',norm($v->all())];if(is_array($v)){foreach($v as $k=>$x)$v[$k]=norm($x);return $v;}if(is_object($v))return ['o',$v::class,get_object_vars($v)];return [gettype($v),$v];}
          function cap($f){try{return ['ok',norm($f())];}catch(Throwable $e){return ['throw',$e::class,$e->getMessage()];}}
          function cmp(&$m,$l,$a,$b){$x=cap($a);$y=cap($b);if($x!==$y)$m[]=[$l,$x,$y];}
          $m=[];
          $sets=['empty'=>[],'seq'=>[1,2,3,4],'sparse'=>[2=>'a',5=>'b',9=>'c'],'assoc'=>[''=>10,'01'=>20,'a'=>30,7=>40],'mixed'=>[0,false,null,'','0',1,true,'1',1.0]];
          foreach($sets as $n=>$i){
            cmp($m,"$n/only-null",fn()=>(new Collection($i))->only(null),fn()=>(new LazyCollection($i))->only(null));
            cmp($m,"$n/has-null",fn()=>(new Collection($i))->has(null),fn()=>(new LazyCollection($i))->has(null));
            cmp($m,"$n/hasAny-null",fn()=>(new Collection($i))->hasAny(null),fn()=>(new LazyCollection($i))->hasAny(null));
            cmp($m,"$n/get-null",fn()=>(new Collection($i))->get(null,'fallback'),fn()=>(new LazyCollection($i))->get(null,'fallback'));
            cmp($m,"$n/before-false",fn()=>(new Collection($i))->before(false),fn()=>(new LazyCollection($i))->before(false));
            cmp($m,"$n/after-false",fn()=>(new Collection($i))->after(false),fn()=>(new LazyCollection($i))->after(false));
            cmp($m,"$n/containsMany-callback",fn()=>(new Collection($i))->containsManyItems(fn($v)=>$v===1),fn()=>(new LazyCollection($i))->containsManyItems(fn($v)=>$v===1));
            cmp($m,"$n/mapWithKeys-generator",fn()=>(new Collection($i))->mapWithKeys(function($v,$k){yield 'x'.$k=>$v;}),fn()=>(new LazyCollection($i))->mapWithKeys(function($v,$k){yield 'x'.$k=>$v;}));
          }
          $rows=[['id'=>1,'name'=>'a'],['id'=>2,'name'=>'b']];
          cmp($m,'pluck-value-closure',fn()=>(new Collection($rows))->pluck(fn($x)=>$x['name']),fn()=>(new LazyCollection($rows))->pluck(fn($x)=>$x['name']));
          cmp($m,'pluck-key-closure',fn()=>(new Collection($rows))->pluck('name',fn($x)=>'k'.$x['id']),fn()=>(new LazyCollection($rows))->pluck('name',fn($x)=>'k'.$x['id']));
          $nested=[['a'=>1,2=>'x'],['a'=>2,5=>'y','b'=>3]];
          cmp($m,'collapse-mixed-keys',fn()=>(new Collection($nested))->collapse(),fn()=>(new LazyCollection($nested))->collapse());
          cmp($m,'collapseWithKeys-mixed-keys',fn()=>(new Collection($nested))->collapseWithKeys(),fn()=>(new LazyCollection($nested))->collapseWithKeys());
          $nl=[new LazyCollection(['a'=>1]),new LazyCollection(['b'=>2])];
          cmp($m,'collapse-nested-lazy',fn()=>(new Collection($nl))->collapse(),fn()=>(new LazyCollection($nl))->collapse());
          cmp($m,'collapseWithKeys-nested-lazy',fn()=>(new Collection($nl))->collapseWithKeys(),fn()=>(new LazyCollection($nl))->collapseWithKeys());
          echo json_encode($m,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES),PHP_EOL;
          echo 'MISMATCH_COUNT=',count($m),PHP_EOL;
          if($m!==[])exit(3);
          PHP
          php /tmp/probe.php
