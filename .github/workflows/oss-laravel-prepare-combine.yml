name: OSS Laravel prepare combine fix

on:
  push:
    branches:
      - automation/laravel-validation

permissions:
  contents: write

jobs:
  prepare-lazy-combine:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE_SHA: 05584e6af46efb31819cf002f621484eb58d8beb
      TARGET_BRANCH: automation/fix-lazy-collection-combine-mismatch
    steps:
      - name: Checkout exact preparation source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/candidate"
          test "$(git rev-parse refs/remotes/origin/candidate)" = "$EXPECTED_SOURCE_SHA"
          git status --porcelain=v1

      - name: Apply minimal source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Illuminate/Collections/LazyCollection.php')
          text = path.read_text()

          short_values = """                if (! $values->valid()) {
                    trigger_error($errorMessage, E_USER_WARNING);

                    break;
                }
"""
          short_values_fix = """                if (! $values->valid()) {
                    throw new \\ValueError($errorMessage);
                }
"""
          extra_values = """            if ($values->valid()) {
                trigger_error($errorMessage, E_USER_WARNING);
            }
"""
          extra_values_fix = """            if ($values->valid()) {
                throw new \\ValueError($errorMessage);
            }
"""

          if text.count(short_values) != 1 or text.count(extra_values) != 1:
              raise SystemExit('expected combine mismatch guards not found exactly once')

          text = text.replace(short_values, short_values_fix, 1)
          text = text.replace(extra_values, extra_values_fix, 1)
          path.write_text(text)
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/Illuminate/Collections/LazyCollection.php"
          git diff --check
          git diff -- src/Illuminate/Collections/LazyCollection.php

      - name: Set up PHP 8.3 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Record PHP 8.3 runtime
        run: |
          php -v
          composer --version

      - name: Install dependencies on PHP 8.3
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run focused regression on PHP 8.3
        run: vendor/bin/phpunit tests/Support/SupportLazyCollectionCombineTest.php

      - name: Run existing combine coverage on PHP 8.3
        run: vendor/bin/phpunit tests/Support/SupportCollectionTest.php --filter Combine

      - name: Run combine laziness coverage on PHP 8.3
        run: vendor/bin/phpunit tests/Support/SupportLazyCollectionIsLazyTest.php --filter testCombineIsLazy

      - name: Check formatting
        run: vendor/bin/pint --test src/Illuminate/Collections/LazyCollection.php tests/Support/SupportLazyCollectionCombineTest.php

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Record PHP 8.4 runtime
        run: php -v

      - name: Run focused regression on PHP 8.4
        run: vendor/bin/phpunit tests/Support/SupportLazyCollectionCombineTest.php

      - name: Run existing combine coverage on PHP 8.4
        run: vendor/bin/phpunit tests/Support/SupportCollectionTest.php --filter Combine

      - name: Run combine laziness coverage on PHP 8.4
        run: vendor/bin/phpunit tests/Support/SupportLazyCollectionIsLazyTest.php --filter testCombineIsLazy

      - name: Commit and fast-forward preparation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/candidate-final"
          test "$(git rev-parse refs/remotes/origin/candidate-final)" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/Illuminate/Collections/LazyCollection.php"
          git diff --check
          git config user.name "Dijedon"
          git config user.email "99071957+dijedontahiri@users.noreply.github.com"
          git add src/Illuminate/Collections/LazyCollection.php
          git commit -m "fix: throw when lazy combine counts differ"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PREPARATION_SHA=$(git rev-parse HEAD)"
