name: OSS Laravel validation

on:
  push:
    branches:
      - automation/laravel-validation

permissions:
  contents: read

jobs:
  lazy-collection-combine:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: 05584e6af46efb31819cf002f621484eb58d8beb
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Record runtime and source
        run: |
          git rev-parse HEAD
          php -v
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run combine regression
        run: vendor/bin/phpunit tests/Support/SupportLazyCollectionCombineTest.php
