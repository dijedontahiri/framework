name: OSS Laravel validate lazy concat baseline

on:
  push:
    branches:
      - automation/laravel-validation

permissions:
  contents: read

jobs:
  lazy-concat-baseline:
    if: github.repository == 'dijedontahiri/framework'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE_SHA: 4b9195346ddf2f9f6c1e6f43f98d393dd87074bf
      BASE_SHA: 1d9727160ad440d1ccf2fdcbb7e4f4f36efae212
    steps:
      - name: Checkout exact test-only candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 2

      - name: Verify test-only tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD~1)" = "$BASE_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_SHA..$CANDIDATE_SHA")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "tests/Support/SupportLazyCollectionConcatKeysTest.php"
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Record runtime
        run: |
          git rev-parse HEAD
          php -v
          composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prove concat key regression fails
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit tests/Support/SupportLazyCollectionConcatKeysTest.php > /tmp/phpunit.out 2>&1
          status=$?
          set -e
          cat /tmp/phpunit.out
          test "$status" -ne 0
          grep -F "Failed asserting that two arrays are identical" /tmp/phpunit.out
          grep -F "SupportLazyCollectionConcatKeysTest" /tmp/phpunit.out
